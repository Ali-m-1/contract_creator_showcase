<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img" aria-labelledby="title desc">
<title id="title">Contract Creator application architecture</title>
<desc id="desc">Staff use the Django application for preparation and pricing, issuance and revisions, permissions, and receipt/signature follow-up. ERP reference data and maintained rules inform preparation. SQLite stores records and version snapshots. Word templates feed document assembly; Microsoft Graph converts and archives issued PDFs in OneDrive.</desc>
