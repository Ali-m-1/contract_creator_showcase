<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Contract Creator</title>
  <desc id="desc">Equipment maintenance contracts. Navy and cyan showcase header with a subtle eighteen-second border highlight.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1420"/>
      <stop offset="0.65" stop-color="#111F2D"/>
      <stop offset="1" stop-color="#132A39"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7DD3FC" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="header-clip"><rect x="1" y="1" width="1198" height="258" rx="22"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="258" rx="22" fill="url(#background)" stroke="#294052"/>
  <g clip-path="url(#header-clip)">
    <circle cx="1040" cy="126" r="230" fill="url(#glow)"/>
    <rect x="838" y="28" width="340" height="204" fill="url(#dots)"/>
    <g fill="none" stroke="#7DD3FC" stroke-width="1">
      <circle cx="1190" cy="-8" r="210" stroke-opacity="0.09"/>
      <circle cx="1190" cy="-8" r="164" stroke-opacity="0.06"/>
      <circle cx="-24" cy="282" r="88" stroke-opacity="0.05"/>
    </g>
  </g>
  <g fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round">
    <rect x="1" y="1" width="1198" height="258" rx="22" pathLength="1000" stroke-dasharray="60 940" opacity="0.10">
      <animate attributeName="stroke-dashoffset" values="0;-1000" dur="18s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="1198" height="258" rx="22" pathLength="1000" stroke-dasharray="30 970" opacity="0.22">
      <animate attributeName="stroke-dashoffset" values="0;-1000" dur="18s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="1198" height="258" rx="22" pathLength="1000" stroke-dasharray="8 992" opacity="0.65">
      <animate attributeName="stroke-dashoffset" values="0;-1000" dur="18s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="64" y="48" width="38" height="3" rx="1.5" fill="#38BDF8" opacity="0.7"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="85" fill="#7FAFC5" font-size="15" font-weight="500" letter-spacing="1.8">SERVICE OPERATIONS</text>
    <text x="62" y="140" fill="#F1F5F9" font-size="43" font-weight="600">Contract Creator</text>
    <text x="64" y="180" fill="#A6B3C2" font-size="21" font-weight="400">Equipment maintenance contracts</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="M984 72H1060L1087 99V195H984Z" fill="#122534" stroke="#426277"/>
    <path d="M956 57H1038L1066 85V180H956Z" fill="#142B3B" stroke="#81BDD2"/>
    <path d="M1038 57V85H1066" stroke="#81BDD2"/>
    <path d="M978 105H1020M978 123H1042M978 141H1028" stroke="#6CA4BD"/>
    <path d="M978 161H1001" stroke="#426277"/>
    <circle cx="1080" cy="183" r="22" fill="#142B3B" stroke="#7DD3FC" stroke-opacity="0.8"/>
    <path d="M1070 183L1077 190L1091 176" stroke="#7DD3FC"/>
  </g>
</svg>
